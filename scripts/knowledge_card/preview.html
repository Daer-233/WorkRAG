<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>工作知识助手 · 卡片预览</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px/1.65 "Microsoft YaHei",system-ui,sans-serif;background:#f4f6f8;color:#1c2738}button,summary{font:inherit;cursor:pointer}button{background:#fff;border:1px solid #dce2ea;border-radius:6px;padding:6px 12px;color:#255fbb}button:focus-visible,summary:focus-visible{outline:2px solid #2675e8;outline-offset:3px}.shell{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}.tools{flex:none;padding:14px 22px;background:white;border-bottom:1px solid #e0e6ed;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.tools h1{font-size:15px;margin:0 12px 0 0}.tools small{color:#748094}.scroller{flex:1;min-height:0;overflow:auto;padding:30px 16px;overscroll-behavior:contain}.card{width:min(100%,660px);margin:auto;border:1px solid #dfe5ed;border-radius:12px;background:#fff;padding:22px 24px;box-shadow:0 3px 12px #23365806;overflow-wrap:anywhere}.head{display:flex;align-items:center;gap:10px;padding-bottom:14px;border-bottom:1px solid #eef1f5}.mark{width:28px;height:28px;background:#eaf2ff;color:#2568c6;display:grid;place-items:center;border-radius:7px}.brand{font-size:15px;font-weight:600}.state{margin-left:auto;color:#547287;font-size:12px}.progress{display:flex;align-items:center;gap:7px;color:#6a7788;font-size:12px;padding-top:13px}.dot{height:6px;width:6px;background:#4681cd;border-radius:50%}.answer{white-space:pre-wrap;margin:15px 0 18px;font-size:14px}.answer a{color:#2672cf;text-decoration:none;font-size:12px;vertical-align:super}.section{padding-top:13px;border-top:1px solid #edf0f4;margin-top:18px}.section summary{display:flex;align-items:center;list-style:none;gap:7px;font-weight:600}.section summary:before{content:'▸';color:#738091}.section[open]>summary:before{content:'▾'}.section summary small{font-size:12px;font-weight:400;color:#7b8797;margin-left:auto}.photo-grid{display:grid;grid-template-columns:repeat(3,minmax(0,96px));gap:10px;margin-top:12px;max-width:308px}.photo{border:0;padding:0;background:#f1f4f8;width:100%;max-width:96px;aspect-ratio:3/2;overflow:hidden;border-radius:5px}.photo img{width:100%;height:100%;object-fit:contain;display:block}.gallery-note{color:#7b8797;font-size:11px;margin-top:8px}.more{margin-top:12px;font-size:12px;color:#3869a9}.more summary{font-weight:400;display:block}.more .photo-grid{color:#1c2738}.sources-title{font-weight:600;font-size:13px;color:#4e6175}.source{padding-top:12px}.source h3{font-size:13px;font-weight:500;margin:0}.source .location{font-size:11px;color:#7c8794;margin-top:3px}.quote{font-size:12px;margin-top:7px;color:#49647e}.quote summary{cursor:pointer}.quote pre{font:12px/1.7 "Microsoft YaHei",sans-serif;white-space:pre-wrap;color:#576271;border-left:2px solid #dce6f2;padding:8px 12px;background:#f7f9fc}.notice{font-size:12px;color:#946a31;white-space:pre-wrap;margin-top:12px}.footer{font-size:10px;color:#9ba5b1;margin-top:18px}.hidden{display:none!important}dialog{max-width:min(95vw,1400px);max-height:94vh;border:0;border-radius:8px;padding:12px}dialog::backdrop{background:#162030b8}dialog img{display:block;max-width:88vw;max-height:78vh;object-fit:contain}dialog button{float:right;margin-bottom:8px}dialog p{clear:both;font-size:12px;color:#6f7c8c;margin:8px 0 0}@media(max-width:520px){.tools{padding:10px 12px;gap:6px}.tools h1{width:100%;font-size:13px}.tools small{width:100%;font-size:11px}.tools button{font-size:11px;padding:4px 7px}.scroller{padding:14px 10px}.card{padding:16px}.photo-grid{gap:8px}.brand{font-size:14px}.state{font-size:11px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important}}
</style>
<div class="shell"><header class="tools"><h1>工作知识助手 · 图文卡片</h1><button id="demo">演示状态与流式</button><button id="done">完成效果</button><button id="busy">繁忙效果</button><button id="fail">失败效果</button><small>本机交互预览 · 演示数据，不代表正在执行检索</small></header><main class="scroller"><article class="card"><header class="head"><span class="mark" aria-hidden="true">知</span><span class="brand">工作知识助手</span><span class="state" id="status">回答完成</span></header><div class="progress"><i class="dot"></i><span id="progress">已根据知识库资料整理</span></div><div class="answer" id="answer"></div><details class="section" id="photos" open><summary><span id="photo-title">相关图片</span><small>点击收起</small></summary><div class="photo-grid" id="first-three"></div><div class="gallery-note">章节配图 · 未确认与具体操作步骤的对应关系</div><details class="more" id="more"><summary id="more-title">查看全部</summary><div class="photo-grid" id="remaining"></div></details></details><section class="section" id="sources"><div class="sources-title">依据</div><div id="source-list"></div></section><div id="notice" class="notice"></div><div class="footer">依据来自本次检索；未提供的版本与页码不作推断。</div></article></main></div><dialog id="lightbox"><button id="close-image">关闭大图</button><img id="large-image" alt=""><p id="large-title"></p></dialog>
<script id="payload" type="application/json">__PAYLOAD__</script>
<script>
const fixture=JSON.parse(document.querySelector('#payload').textContent),$=s=>document.querySelector(s);let serial=0;
function answer(text){const root=$('#answer');root.replaceChildren();for(const piece of text.split(/(\[\d+\])/)){const match=piece.match(/^\[(\d+)\]$/);if(match&&fixture.sources[Number(match[1])-1]){const a=document.createElement('a');a.href='#source-'+match[1];a.textContent=piece;a.setAttribute('aria-label','查看依据 '+match[1]);a.onclick=()=>{const source=$('#source-'+match[1]);source.querySelector('details').open=true;source.scrollIntoView({block:'nearest'})};root.append(a)}else root.append(document.createTextNode(piece))}}
function photo(image,index){const b=document.createElement('button');b.className='photo';b.setAttribute('aria-label','查看大图：'+image.name);const img=document.createElement('img');img.src=image.src;img.alt=image.name;img.onerror=()=>{b.textContent='图片暂不可用';b.disabled=true};b.append(img);b.onclick=()=>{$('#large-image').src=image.preview_src||image.src;$('#large-image').alt=image.name;$('#large-title').textContent=image.name+' · '+(image.association==='step'?'步骤配图':'章节配图');$('#lightbox').showModal()};return b}
fixture.images.forEach((image,index)=>$(index<3?'#first-three':'#remaining').append(photo(image,index)));
$('#photo-title').textContent='相关图片 · '+fixture.images.length+' 张';$('#more-title').textContent='查看全部 '+fixture.images.length+' 张';$('#more').hidden=fixture.images.length<=3;
fixture.sources.forEach(source=>{const box=document.createElement('section');box.className='source';box.id='source-'+source.number;const title=document.createElement('h3');title.textContent='['+source.number+'] '+source.title;const loc=document.createElement('div');loc.className='location';loc.textContent=[source.chapter,source.version?'版本 '+source.version:'版本未标注',source.pages.length?'第 '+source.pages.join('、')+' 页':'原资料未提供页码'].filter(Boolean).join(' · ');const details=document.createElement('details');details.className='quote';const summary=document.createElement('summary');summary.textContent='查看引用原文';const quote=document.createElement('pre');quote.textContent=source.excerpts.join('\n\n');details.append(summary,quote);box.append(title,loc,details);$('#source-list').append(box)});
function state(status,progress,text,{photos=true,sources=true,notice=''}={}){$('#status').textContent=status;$('#progress').textContent=progress;answer(text);$('#photos').hidden=!photos||!fixture.images.length;$('#sources').hidden=!sources||!fixture.sources.length;$('#notice').textContent=notice}
function done(){serial++;state('回答完成','已根据知识库资料整理',fixture.answer);$('#photos').open=true;$('#more').open=false}
$('#done').onclick=done;$('#busy').onclick=()=>{serial++;state('知识库正忙','本次尚未执行检索','请稍后重试。不能据此判断资料不存在。',{photos:false,sources:false})};$('#fail').onclick=()=>{serial++;state('处理失败','已保留可用内容',fixture.answer,{notice:'后续处理失败，已取得的文字、图片和依据仍可查看。'})};
$('#photos').addEventListener('toggle',()=>{if(!$('#photos').open)$('#more').open=false;$('#photos summary small').textContent=$('#photos').open?'点击收起':'点击展开'});
$('#demo').onclick=async()=>{const id=++serial,wait=ms=>new Promise(r=>setTimeout(r,ms));state('正在处理','正在处理你的问题…','',{photos:false,sources:false});await wait(600);if(id!==serial)return;state('正在检索资料','正在检索已发布的知识库资料…','',{photos:false,sources:false});await wait(800);if(id!==serial)return;state('正在生成回答','正在根据检索证据整理回答…','',{photos:false,sources:false});const chunks=fixture.answer.match(/.{1,14}/gs)||[];let text='';for(const chunk of chunks){await wait(500);if(id!==serial)return;text+=chunk;state('正在生成回答','演示：按预设事件逐段更新',text,{photos:false,sources:true})}state('正在准备图片','正在读取并准备配图…',text,{photos:false});await wait(700);if(id!==serial)return;state('回答完成','演示完成；真实模式只转发实际到达的增量',text)};
$('#close-image').onclick=()=>$('#lightbox').close();$('#lightbox').onclick=e=>{if(e.target===$('#lightbox'))$('#lightbox').close()};done();
</script></html>
