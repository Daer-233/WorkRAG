apiVersion: v1
kind: Plugin
metadata:
  author: workrag
  name: WorkRAGGraph
  repository: https://github.com/Daer-233/WorkRAG
  version: 0.4.2
  description:
    en_US: Local pilot workflow with scoped read-only tools and reviewed answers.
    zh_Hans: 处理器调用的问答引擎；LangGraph 管理记忆和追问，Pi 执行模型与工具循环，保留反馈审核；资料由 WorkRAG 管理。
  label:
    en_US: WorkRAG Graph
    zh_Hans: 问答引擎插件
  icon: assets/icon.svg
spec:
  config:
    - name: pi_harness_url
      type: string
      label: {en_US: Pi worker URL, zh_Hans: Pi 工作进程地址}
      default: ws://host.docker.internal:8062/run
      required: false
    - name: pi_harness_token
      type: password
      label: {en_US: Pi transport token, zh_Hans: Pi 内部传输令牌（不是模型密钥）}
      required: false
    - name: database_dsn
      type: password
      label: {en_US: Workflow database DSN, zh_Hans: 独立工作流数据库连接}
      required: true
    - name: scope_secret
      type: password
      label: {en_US: Run scope signing secret, zh_Hans: 运行范围签名密钥}
      required: true
    - name: workspace
      type: string
      label: {en_US: Authorized workspace, zh_Hans: 授权工作区 ID}
      required: true
  components:
    Runner:
      fromDirs:
        - path: components/runner/
          maxDepth: 1
    Page:
      fromDirs:
        - path: components/pages/
          maxDepth: 2
execution:
  python:
    path: main.py
    attr: WorkRAGGraph
